[package]
name = "eram"
version = "0.1.0"
edition = "2021"
description = "EramLang: a small, real compiler and virtual machine written in Rust"
default-run = "eram"

[[bin]]
name = "eram"
path = "src/main.rs"

[lib]
name = "eram"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "=1.0.63"
anyhow = "=1.0.86"
colored = "=2.1.0"

[profile.release]
opt-level = 3
